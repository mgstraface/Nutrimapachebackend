# nginx DENTRO del contenedor "web": sirve la PWA y reenvía /api al contenedor de la API.
# El HTTPS y el dominio los maneja el nginx del VPS (compartido con Casa Roma y el robot),
# que apunta a 127.0.0.1:${WEB_PORT}.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # El service worker nunca se cachea, así las actualizaciones llegan al iPhone.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
